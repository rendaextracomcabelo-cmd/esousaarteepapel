<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel E Sousa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: app de uma coluna, cabeçalho + abas (barra inferior no celular), conteúdo em cartões, formulários em folha deslizante. */
  :root{
    --bg:#F7F2E8; --surface:#FFFDF8; --surface2:#F0E9DA; --ink:#3F3126; --ink2:#6F5F4E; --muted:#8F8272;
    --line:#E4D8C2; --accent:#B25738; --on-accent:#FFFFFF; --shadow:rgba(63,49,38,.14);
    --good:#0B6B0B; --bad:#B42F2F; --warn:#8A5A00; --bar:#8F8272;
    --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300; --s6:#4a3aa7; --s7:#e34948;
    --display:"Caveat","Segoe Script",cursive;
    --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1F1812; --surface:#2A2119; --surface2:#33291F; --ink:#F3E8D8; --ink2:#C9B8A0; --muted:#9C8E7C;
      --line:#44382A; --accent:#E08A68; --on-accent:#2B1A10; --shadow:rgba(0,0,0,.45);
      --good:#4FC24F; --bad:#EF7B7B; --warn:#F0B84A; --bar:#9C8E7C;
      --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300; --s6:#9085e9; --s7:#e66767;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1F1812; --surface:#2A2119; --surface2:#33291F; --ink:#F3E8D8; --ink2:#C9B8A0; --muted:#9C8E7C;
    --line:#44382A; --accent:#E08A68; --on-accent:#2B1A10; --shadow:rgba(0,0,0,.45);
    --good:#4FC24F; --bad:#EF7B7B; --warn:#F0B84A; --bar:#9C8E7C;
    --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300; --s6:#9085e9; --s7:#e66767;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 96px}
  .app{max-width:960px;margin:0 auto}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}

  /* cabeçalho */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
  .brand b{font-family:var(--display);font-size:1.9rem;line-height:1;font-weight:700}
  .brand small{display:block;color:var(--ink2);font-size:.78rem;margin-top:2px}
  .top-r{display:flex;align-items:center;gap:8px}
  .chip{font-size:.76rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .chip[data-s="saved"]::before{background:var(--good)}
  .chip[data-s="saving"]::before{background:var(--warn)}
  .chip[data-s="err"]{color:var(--bad);border-color:var(--bad);cursor:pointer}
  .chip[data-s="err"]::before{background:var(--bad)}
  .icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink)}
  .icon-btn[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  /* abas */
  .tabs{display:flex;gap:6px;margin-block:8px 18px}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border:1px solid transparent;background:transparent;border-radius:12px;color:var(--ink2);font-size:.74rem;font-weight:600}
  .tabs button[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
  @media (max-width:719px){
    .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
    .tabs button[aria-current="page"]{box-shadow:none;background:var(--surface2);border-color:transparent}
  }
  @media (min-width:720px){
    .tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:.9rem;padding:10px 12px}
    body{padding-block:0 48px}
  }

  /* blocos */
  main{display:grid;gap:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
  .card h2,.sec-h{font-size:1rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card h2 small,.sec-h small{font-weight:500;color:var(--ink2);font-size:.8rem}
  .mnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mnav h1{font-family:var(--display);font-size:2.1rem;line-height:1;margin:0;font-weight:700;min-width:9ch;text-align:center;text-transform:capitalize}
  .mnav .step{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1}
  .link{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 2px;font-size:.85rem}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px;align-content:start;min-width:0}
  .tile span{font-size:.78rem;color:var(--ink2);font-weight:600}
  .tile b{font-size:1.4rem;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .tile small{font-size:.74rem;color:var(--ink2)}
  .tile.hero{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .tile.hero span,.tile.hero small{color:color-mix(in srgb,var(--bg) 78%,transparent)}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .tile.hero .pos{color:#7BE07B} .tile.hero .neg{color:#FF9C9C}

  .flow{margin:0;display:grid}
  .flow div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .flow div:last-child{border-bottom:0}
  .flow dt{color:var(--ink2)} .flow dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .flow .tot dt{color:var(--ink);font-weight:700} .flow .tot dd{font-size:1.1rem}
  .flow .tot{border-bottom:1px solid var(--line)}

  .grid2{display:grid;gap:18px}
  @media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}

  /* barras */
  .bars{display:grid;gap:10px}
  .brow{display:grid;grid-template-columns:minmax(76px,28%) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
  .bl{min-width:0;overflow-wrap:anywhere;color:var(--ink)}
  .btrack{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
  .btrack i{display:block;height:100%;border-radius:0 6px 6px 0;min-width:0}
  .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .bv em{font-style:normal;font-weight:500;color:var(--ink2);font-size:.76rem;margin-left:4px}
  .empty{color:var(--ink2);font-size:.9rem;padding:10px 0}

  /* listas */
  .list{list-style:none;margin:0;padding:0;display:grid}
  .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
  .row:last-child{border-bottom:0}
  .row:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
  .row .dt{font-size:.78rem;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:2.6rem}
  .row .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
  .row .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.78rem;color:var(--ink2);font-weight:400;margin-top:2px}
  .row .am{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row .am small{display:block;font-weight:500;color:var(--ink2);font-size:.74rem}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;flex:none}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;background:transparent;line-height:1.5}
  button.pill{min-height:26px}
  .pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
  .pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
  .pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
  .pill.neutral{color:var(--ink2)}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--ink2);min-height:34px}
  .fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  /* estoque */
  .prod{display:grid;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .prod:last-child{border-bottom:0}
  .prod-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .prod-h .nm{font-weight:700;overflow-wrap:anywhere}
  .prod-h .sku{font-size:.76rem;color:var(--ink2)}
  .qty{font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
  .qty small{display:block;font-size:.7rem;font-weight:600;color:var(--ink2);margin-top:4px}
  .pmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.82rem;color:var(--ink2)}
  .pmeta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .pact{display:flex;gap:8px;flex-wrap:wrap}

  /* botões e campos */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
  .btn.danger.armed{background:var(--bad);color:var(--surface)}
  .btn.sm{min-height:36px;padding:0 12px;font-size:.84rem;border-radius:10px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  label{display:grid;gap:5px;font-size:.8rem;font-weight:600;color:var(--ink2);min-width:0}
  input[type=text],input[type=date],select,input:not([type]),input[inputmode]{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--ink)}
  input::placeholder{color:var(--muted)}
  label.check{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink);font-weight:500;min-height:40px}
  label.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .note{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
  .note p{margin:0;flex:1 1 240px}
  .preview{background:var(--surface2);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:.86rem}
  .preview div{display:flex;justify-content:space-between;gap:10px}
  .preview .warnline{color:var(--warn);font-weight:600}
  .err{color:var(--bad);font-size:.85rem;font-weight:600;min-height:1.2em;margin:0}

  /* configurações */
  .crow{display:grid;grid-template-columns:auto minmax(0,1fr) 92px auto;gap:10px;align-items:center;padding:6px 0}
  .sw{width:14px;height:14px;border-radius:4px}
  .pct{display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .cat{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 12px;font-size:.84rem}
  .cat button{width:24px;height:24px;border-radius:50%;border:0;background:transparent;color:var(--ink2);font-size:1rem;line-height:1}
  .inline-form{display:flex;gap:8px}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .help{font-size:.82rem;color:var(--ink2);margin:0 0 12px}

  /* histórico */
  .legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-bottom:8px}
  .chart{overflow-x:auto}
  .chart svg{display:block;width:100%;min-width:480px;height:auto}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
  th{font-size:.74rem;color:var(--ink2);font-weight:700}
  tfoot td{font-weight:700;border-bottom:0}

  /* folha */
  .sheet{position:fixed;inset:0;z-index:50;background:rgba(20,14,8,.5);display:flex;align-items:flex-end;justify-content:center}
  .sheet-p{background:var(--surface);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
  @media (min-width:720px){.sheet{align-items:center}.sheet-p{border-radius:20px;max-height:90%}}
  .sheet-h{display:flex;justify-content:space-between;align-items:center}
  .sheet-h h2{margin:0;font-size:1.1rem}
  .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.1rem;line-height:1}
  .sheet-f{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .noscroll{overflow:hidden}

  .tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:.78rem;white-space:pre-line;max-width:260px;box-shadow:0 4px 14px var(--shadow)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;max-width:90vw}
  @media (min-width:720px){.toast{bottom:28px}}
  @media (prefers-reduced-motion:no-preference){.sheet-p{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
  body{margin:0}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i><div><b>E Sousa Arte &amp; Papel</b><small>Vendas, estoque e financeiro</small></div></div>
    <div class="top-r">
      <button class="chip" id="status" data-s="local" data-act="retry" type="button">Carregando…</button>
      <button class="icon-btn" id="cfgBtn" data-act="tab" data-tab="config" aria-label="Configurações" type="button"></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <main id="main"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <form class="sheet-p" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="x" type="button" data-act="closeSheet" aria-label="Fechar">×</button></div>
    <div id="sheetBody" style="display:grid;gap:12px"></div>
    <p class="err" id="sheetErr" role="alert"></p>
    <div class="sheet-f">
      <button class="btn danger sm" type="button" id="sheetDel" data-act="sheetDelete" hidden>Excluir</button>
      <span style="flex:1"></span>
      <button class="btn ghost" type="button" data-act="closeSheet">Cancelar</button>
      <button class="btn" type="submit" id="sheetSubmit">Salvar</button>
    </div>
  </form>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileVendas" accept=".csv,.xlsx,.xls,text/csv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var NUM=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
var money=function(n){return BRL.format(n||0)};
var signed=function(n){return n<0?'−'+money(-n):money(n)};
var pad=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function curMonth(){return todayStr().slice(0,7)}
function mk(d){return String(d).slice(0,7)}
function monthLabel(k){var p=k.split('-');return MESES[+p[1]-1]+' '+p[0]}
function shiftMonth(k,n){var p=k.split('-').map(Number),y=p[0],m=p[1]+n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}
function fmtDay(d){return d.slice(8,10)+'/'+d.slice(5,7)}
function parseNum(s){
  if(typeof s==='number')return isFinite(s)?s:0;
  s=String(s||'').trim().replace(/[R$\s]/g,'');
  if(!s)return 0;
  if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.')}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  var n=parseFloat(s);return isFinite(n)?n:0;
}
function fmtIn(n){return (Math.round((n||0)*100)/100).toFixed(2).replace('.',',')}
function compact(n){var a=Math.abs(n);if(a>=1000)return (n/1000).toFixed(a>=10000?0:1).replace('.',',')+' mil';return String(Math.round(n))}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i]);return t}

/* ---------- ícones ---------- */
var IC={
  resumo:'M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z',
  vendas:'M5 8h14l-1 12H6L5 8zM9 8a3 3 0 016 0',
  estoque:'M3 8l9-5 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8',
  despesas:'M4 6h16v13H4zM4 10h16M15 15h2',
  hist:'M5 20V10M12 20V4M19 20v-7',
  config:'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4'
};
function ic(n){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IC[n]+'"/></svg>'}

/* ---------- estado ---------- */
var LS='esousa_painel_v1';
var CATS=['Taxas cartão','Fretes e passagem','Insumos','Matérias para loja','Extras','Micro','Serviços terceirizado','Prolabore','Nenhum'];
function defaultConfig(){
  return {canais:[
    {id:'tiktok',nome:'TikTok Shop',taxa:0,cor:0},

function normalize(s){
  s=s||{};
  var c=s.config||{},d=defaultConfig();
  c.canais=(c.canais&&c.canais.length)?c.canais:d.canais;
  c.categorias=(c.categorias&&c.categorias.length)?c.categorias:d.categorias;

  return {config:c,produtos:s.produtos||[],movs:s.movs||[],vendas:s.vendas||[],despesas:s.despesas||[]};
}

/* ---------- cálculos ---------- */
function canalInfo(id){for(var i=0;i<S.config.canais.length;i++)if(S.config.canais[i].id===id)return S.config.canais[i];return {id:id,nome:'Outro',taxa:0,cor:7}}
function prodById(id){for(var i=0;i<S.produtos.length;i++)if(S.produtos[i].id===id)return S.produtos[i];return null}
function estoque(p){
  if(!p.controla)return null;
  var q=+p.inicial||0,i,d=p.desde||'';
  /* só conta entradas e vendas a partir da data em que o estoque foi contado */
  for(i=0;i<S.movs.length;i++)if(S.movs[i].prod===p.id&&S.movs[i].data>=d)q+=S.movs[i].qtd;
  for(i=0;i<S.vendas.length;i++)if(S.vendas[i].prod===p.id&&S.vendas[i].data>=d)q-=S.vendas[i].qtd;
  return q;
}
function stockState(p){
  var q=estoque(p);
  if(q===null)return {q:null,k:'dig',t:'Digital',c:'neutral'};
  if(q<=0)return {q:q,k:'zero',t:'Zerado',c:'bad'};
  if(p.min>0&&q<=p.min)return {q:q,k:'low',t:'Repor',c:'warn'};
  return {q:q,k:'ok',t:'OK',c:'ok'};
}
function bruto(v){return v.qtd*v.unit}
function liquido(v){return bruto(v)-(v.taxa||0)-(v.frete||0)}
function lucroV(v){return liquido(v)-v.qtd*(v.custoUn||0)}
function stats(m){
  var vs=S.vendas.filter(function(v){return mk(v.data)===m}),ds=S.despesas.filter(function(d){return mk(d.data)===m});
  var fat=sum(vs,bruto),taxas=sum(vs,function(v){return v.taxa||0}),fretes=sum(vs,function(v){return v.frete||0});
  var cmv=sum(vs,function(v){return v.qtd*(v.custoUn||0)});
  var pagas=sum(ds.filter(function(d){return d.pago}),function(d){return d.valor});
  var apagar=sum(ds.filter(function(d){return !d.pago}),function(d){return d.valor});
  var lucro=fat-taxas-fretes-pagas;
  var porCanal={};vs.forEach(function(v){porCanal[v.canal]=(porCanal[v.canal]||0)+bruto(v)});
  return {vs:vs,ds:ds,nv:vs.length,fat:fat,taxas:taxas,fretes:fretes,cmv:cmv,pagas:pagas,apagar:apagar,lucro:lucro,prev:lucro-apagar,lucroVendas:fat-taxas-fretes-cmv,porCanal:porCanal};
}
function aReceber(){var a=S.vendas.filter(function(v){return !v.recebido});return {n:a.length,v:sum(a,liquido)}}

/* ---------- persistência ---------- */
var db=null,dbMode='loading',dirty={},flushing=false,timer=null;
function setStatus(s){
  var el=$('#status');if(!el)return;
  el.dataset.s=s;
  el.textContent={saved:'Salvo',saving:'Salvando…',local:'Só neste aparelho',err:'Erro ao salvar. Tocar para tentar de novo',loading:'Carregando…'}[s]||s;
}
function touch(kind,key){dirty[kind==='main'?'main':kind+'/'+key]=1}
function touchAll(){
  touch('main');
  ['vendas','despesas','movs'].forEach(function(c){S[c].forEach(function(i){touch(c,mk(i.data))})});
}
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(dbMode==='loading')return;
  if(dbMode!=='db'){setStatus('local');return}
  setStatus('saving');clearTimeout(timer);timer=setTimeout(flush,600);
}
function writeKey(k){
  if(k==='main')return db.doc('app/main').set({config:S.config,produtos:S.produtos,updatedAt:Date.now()});
  var p=k.split('/'),c=p[0],m=p[1];
  var items=S[c].filter(function(i){return mk(i.data)===m});
  return db.doc(c+'/'+m).set({items:items});
}
async function flush(){
  if(dbMode!=='db')return;
  if(flushing){clearTimeout(timer);timer=setTimeout(flush,400);return}
  flushing=true;var k=null;
  try{
    while(Object.keys(dirty).length){
      k=Object.keys(dirty)[0];delete dirty[k];
      try{await writeKey(k)}catch(e){dirty[k]=1;throw e}
    }
    setStatus('saved');
  }catch(e){setStatus('err')}
  finally{flushing=false}
}
async function loadRemote(){
  try{
    if(!(window.claude&&window.claude.use)){dbMode='local';setStatus('local');return}
    var d=await window.claude.use('db');
    if(!d){dbMode='local';setStatus('local');return}
    var main=await d.doc('app/main').get();
    var next=null;
    if(main.exists){
      var m=JSON.parse(JSON.stringify(main.data()));
      next={config:m.config,produtos:m.produtos,vendas:[],despesas:[],movs:[]};
      var cols=['vendas','despesas','movs'];
      for(var i=0;i<cols.length;i++){
        var q=await d.collection(cols[i]).get();
        q.docs.forEach(function(s){var it=JSON.parse(JSON.stringify(s.data())).items||[];it.forEach(function(x){next[cols[i]].push(x)})});
      }
    }
    db=d;dbMode='db';dirty={};
    if(next){S=normalize(next);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}setStatus('saved');render()}
    else{touchAll();setStatus('saving');flush()}
  }catch(e){dbMode='local';setStatus('local')}
}
function commit(){render();persist()}

function histMonths(){
  var all=[];['vendas','despesas'].forEach(function(c){S[c].forEach(function(i){all.push(mk(i.data))})});
  var end=curMonth(),first=all.length?all.sort()[0]:end,start=first;
  if(start<shiftMonth(end,-23))start=shiftMonth(end,-23);
  if(start>shiftMonth(end,-5))start=shiftMonth(end,-5);
  var out=[],m=start;while(m<=end){out.push(m);m=shiftMonth(m,1)}
  return out;
}
function histChart(months){
  var canais=S.config.canais.slice();
  var data=months.map(function(m){var st=stats(m);return {m:m,st:st}});
  var max=Math.max.apply(null,data.map(function(d){return d.st.fat}).concat([0]));
  if(max<=0)return '<p class="empty">Ainda não há vendas para mostrar no gráfico.</p>';
  var step=Math.pow(10,Math.floor(Math.log10(max/4)));
  var cand=[1,2,2.5,5,10],t=step;for(var i=0;i<cand.length;i++){t=cand[i]*step;if(max/t<=4)break}
  var top=Math.ceil(max/t)*t,W=640,H=240,L=48,R=8,T=12,B=30,pw=W-L-R,ph=H-T-B,n=months.length,slot=pw/n,bw=Math.min(44,slot*.62);
  var y=function(v){return T+ph-v/top*ph};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="min-width:'+Math.max(480,n*40)+'px" role="img" aria-label="Faturamento por mês e canal">';
  for(var g=0;g<=top/t+0.001;g++){var gv=g*t;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(gv)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+compact(gv)+'</text>'}
  data.forEach(function(d,i){
    var cx=L+slot*i+slot/2,acc=0;
    canais.forEach(function(c){
      var v=d.st.porCanal[c.id]||0;if(v<=0)return;
      var y1=y(acc+v),y0=y(acc);acc+=v;
      s+='<rect x="'+(cx-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(0,y0-y1)+'" fill="var(--s'+c.cor+')" stroke="var(--surface)" stroke-width="2"/>';
    });
    var extra=d.st.fat-acc;
    if(extra>0.005){var y1=y(acc+extra),y0=y(acc);s+='<rect x="'+(cx-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(0,y0-y1)+'" fill="var(--s7)" stroke="var(--surface)" stroke-width="2"/>'}
    var p=d.m.split('-'),lab=MES3[+p[1]-1]+((+p[1]===1||i===0)?' '+p[0].slice(2):'');
    s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--ink2)">'+lab+'</text>';
    var tip=monthLabel(d.m)+'\nFaturamento '+money(d.st.fat)+canais.map(function(c){var v=d.st.porCanal[c.id]||0;return v>0?'\n'+c.nome+' '+money(v):''}).join('')+'\nLucro líquido '+signed(d.st.lucro);
    s+='<rect x="'+(L+slot*i)+'" y="'+T+'" width="'+slot+'" height="'+ph+'" fill="transparent" data-tip="'+esc(tip)+'"/>';
  });
  return s+'</svg>';
}

function toCsv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n')}
async function saveFile(name,data){
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){toast('Salvar arquivos não está disponível aqui.');return}

  }catch(e){if(!e||e.code!=='declined')toast('Não foi possível salvar o arquivo.')}

function parseCsv(text){
  text=text.replace(/^﻿/,'');var first=text.split(/\r?\n/)[0]||'';
  var sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(c){return c.trim()!==''})});
}
function normH(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function csvProdutos(text){

  var H=rows[0].map(normH),col=function(names){for(var i=0;i<H.length;i++)if(names.indexOf(H[i])>=0)return i;return -1};
  var cN=col(['nome','produto','name','item']),cS=col(['sku','codigo','cod']),cC=col(['custo','custo unitario','cost']),cP=col(['preco','preco de venda','valor','price']),cE=col(['estoque','qtd','quantidade','stock']),cM=col(['minimo','min','estoque minimo']),cD=col(['digital','tipo']);
  if(cN<0)return [];
  return rows.slice(1).map(function(r){
    var nome=(r[cN]||'').trim();if(!nome)return null;
    var dg=cD>=0&&/^(sim|s|1|digital|yes|true)$/i.test((r[cD]||'').trim());
    return {id:uid(),nome:nome,sku:cS>=0?(r[cS]||'').trim():'',custo:cC>=0?parseNum(r[cC]):0,preco:cP>=0?parseNum(r[cP]):0,controla:!dg,inicial:(!dg&&cE>=0)?Math.floor(parseNum(r[cE])):0,min:cM>=0?Math.floor(parseNum(r[cM])):0,desde:todayStr()};
  }).filter(Boolean);
}

var ALI={

  item:['produto','item','nome do produto','nome do item','product name','titulo','title','product','descricao','nome do produto (sku)'],

  qtd:['quantidade','qtd','quantity','qty','quantidade vendida','items sold'],

  total:['order earnings','total','valor total','subtotal','order amount','valor do pedido','valor da venda','total do pedido'],
  taxa:['taxa','taxas','comissao','commission','fee','taxa de comissao','taxa de servico','taxas da plataforma'],
  frete:['frete','shipping','frete pago pelo vendedor','shipping fee','taxa de envio','custo de envio'],

};
/* relatório "Profit & Loss" do TikTok Shop: várias colunas de taxa e de frete que somam o custo do pedido */
var TAXAS_MULTI=['platform commission fee','commission paid to creators','commission paid to affiliate partners','sfp service fee','shop ads commission paid to creators','shop ads commission paid to affiliate partners','gmv max ad fee','fee per item sold','icms difal','icms penalty'];
var FRETE_MULTI=['shipping cost covered by tiktok shop','customer shipping fee','refunded customer shipping fee','shipping cost for returns','shipping cost','return shipping fee reimbursement'];
function norm(s){return normH(String(s==null?'':s))}
function findCol(H,list){for(var i=0;i<list.length;i++){var k=H.indexOf(list[i]);if(k>=0)return k}return -1}
function parseDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'&&v>20000&&v<80000){var d=new Date(Math.round(v*86400000)+Date.UTC(1899,11,30));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  var s=String(v).trim(),m;
  if((m=s.match(/^(20\d{2})(\d{2})(\d{2})$/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){
    var y=m[3].length===2?'20'+m[3]:m[3],dd=+m[1],mo=+m[2];
    if(mo>12&&dd<=12){var t=dd;dd=mo;mo=t}
    if(mo<1||mo>12||dd<1||dd>31)return '';
    return y+'-'+pad(mo)+'-'+pad(dd);
  }
  return '';
}
function shortName(s){s=String(s||'').trim();var i=s.indexOf('|');if(i>0)s=s.slice(0,i).trim();return s.length>70?s.slice(0,69)+'…':s}
function mapVendas(rows){
  var best=-1,bs=0,i;
  for(i=0;i<Math.min(rows.length,15);i++){
    var H0=rows[i].map(norm),sc=0;
    Object.keys(ALI).forEach(function(key){if(findCol(H0,ALI[key])>=0)sc++});
    if(sc>bs){bs=sc;best=i}
  }
  if(best<0||bs<2)return {err:'Não reconheci as colunas. A planilha precisa ter uma coluna de data e uma de valor (preço ou total).'};
  var H=rows[best].map(norm),raw=rows[best].map(function(x){return String(x==null?'':x)}),c={};
  Object.keys(ALI).forEach(function(key){c[key]=findCol(H,ALI[key])});
  if(c.data<0){for(i=0;i<H.length;i++)if(/(^|\s)(data|date)(\s|$)/.test(H[i])){c.data=i;break}}
  var tx=[],fr=[];
  H.forEach(function(h,k){if(TAXAS_MULTI.indexOf(h)>=0)tx.push(k);if(FRETE_MULTI.indexOf(h)>=0)fr.push(k)});
  if(c.data<0)return {err:'Não achei a coluna de data.'};
  if(c.unit<0&&c.total<0)return {err:'Não achei a coluna de valor (preço ou total).'};
  var items=[],amostras=[],cancel=0,semValor=0;
  var soma=function(r,cols){var t=0;cols.forEach(function(k){t+=parseNum(r[k])});return t};
  for(i=best+1;i<rows.length;i++){
    var r=rows[i],d=parseDate(r[c.data]);if(!d)continue;
    if(c.status>=0&&/cancel/.test(norm(r[c.status]))){cancel++;continue}
    var q=c.qtd>=0?Math.max(1,Math.floor(parseNum(r[c.qtd]))||1):1;
    var unit=c.unit>=0?parseNum(r[c.unit]):parseNum(r[c.total])/q;
    if(!(unit>0)){
      var custo=c.margem>=0?parseNum(r[c.margem]):0;
      if(custo<0)amostras.push({data:d,custo:-custo,tipo:c.amostra>=0?(String(r[c.amostra]).trim()?'amostra':'devolucao'):'outro'});else semValor++;
      continue;
    }
    var nome=c.item>=0?(c.sku>=0?[shortName(r[c.item]),String(r[c.sku]).trim()].filter(Boolean).join(' · '):String(r[c.item]).trim()):(c.sku>=0?String(r[c.sku]).trim():'Venda importada');
    var taxa=tx.length?Math.max(0,-soma(r,tx)):(c.taxa>=0?Math.abs(parseNum(r[c.taxa])):null);
    var frete=fr.length?-soma(r,fr):(c.frete>=0?Math.abs(parseNum(r[c.frete])):0);
    items.push({data:d,nome:nome||'Venda importada',qtd:q,unit:unit,taxa:taxa,frete:Math.round(frete*100)/100,pedido:c.pedido>=0?String(r[c.pedido]).trim():'',canalTxt:c.canal>=0?norm(r[c.canal]):'',rec:c.settled>=0?!!String(r[c.settled]).trim():null});
  }
  var names={};Object.keys(c).forEach(function(k){if(c[k]>=0)names[k]=raw[c[k]]});
  if(tx.length)names.taxa='soma de '+tx.length+' colunas de taxas';
  if(fr.length)names.frete='soma de '+fr.length+' colunas de frete';
  return {items:items,names:names,amostras:amostras,cancel:cancel,semValor:semValor};
}

        var cat=S.config.categorias.indexOf('Fretes e passagem')>=0?'Fretes e passagem':S.config.categorias[0];
        Object.keys(byM).forEach(function(k){
          var o=byM[k],desc=nomes[o.t]+' ('+monthLabel(o.m)+')',velha='Amostras grátis e devoluções ('+monthLabel(o.m)+')';
          if(o.t!=='outro'){
            var antes=S.despesas.length;
            S.despesas=S.despesas.filter(function(d){return !(d.desc===velha&&d.obs==='importada')});
            if(S.despesas.length!==antes)touch('despesas',o.m);
          }
          var ja=S.despesas.filter(function(d){return d.desc===desc})[0],val=Math.round(o.v*100)/100;
          if(ja){if(Math.abs(ja.valor-val)>0.004){ja.valor=val;if(o.d>ja.data)ja.data=o.d;touch('despesas',o.m)}return}
          S.despesas.push({id:uid(),data:o.d,desc:desc,cat:cat,valor:val,pago:true,canal:'tiktok',obs:'importada'});
          touch('despesas',o.m);nd++;
        });
      }
      Object.keys(months).forEach(function(k){touch('vendas',k)});
      if(last){V.mes=mk(last);V.tab='hist'}
      commit();toast(n+' vendas importadas'+(skipped?(' · '+skipped+' já existiam'+(upd?(' ('+upd+' atualizadas)'):'')):'')+(nd?(' · '+nd+(nd===1?' despesa lançada':' despesas lançadas')):'')+'.');return true;
    }
  });
}

/* ---------- ações ---------- */
var act={
  tab:function(d){V.tab=d.tab;render();window.scrollTo(0,0)},
  mprev:function(){V.mes=shiftMonth(V.mes,-1);render()},
  mnext:function(){V.mes=shiftMonth(V.mes,1);render()},
  mnow:function(){V.mes=curMonth();render()},
  retry:function(){if(dbMode==='db'){setStatus('saving');flush()}},
  closeSheet:closeSheet,
  sheetDelete:function(d,b){arm(b,function(){var f=SH&&SH.del;closeSheet();if(f)f()})},
  newVenda:function(){vendaSheet()},editVenda:function(d){vendaSheet(d.id)},
  togRec:function(d){var v=S.vendas.filter(function(x){return x.id===d.id})[0];if(!v)return;v.recebido=!v.recebido;touch('vendas',mk(v.data));commit()},
  newDesp:function(){despSheet()},editDesp:function(d){despSheet(d.id)},
  togPago:function(d){var x=S.despesas.filter(function(y){return y.id===d.id})[0];if(!x)return;x.pago=!x.pago;touch('despesas',mk(x.data));commit()},
  newProd:function(){prodSheet()},editProd:function(d){prodSheet(d.id)},entrada:function(d){entradaSheet(d.id)},ajuste:function(d){ajusteSheet(d.id)},
  canalF:function(d){V.canal=d.id;render()},despF:function(d){V.despF=d.f;render()},
  estF:function(){V.soBaixo=!V.soBaixo;render()},
  delMov:function(d,b){arm(b,function(){var m=S.movs.filter(function(x){return x.id===d.id})[0];if(!m)return;S.movs=S.movs.filter(function(x){return x!==m});touch('movs',mk(m.data));commit()})},
  hideHint:function(){S.config.hintTaxa=false;touch('main');commit()},
  addCanal:function(){
    var usedC={};S.config.canais.forEach(function(c){usedC[c.cor]=1});var cor=7;for(var i=0;i<8;i++)if(!usedC[i]){cor=i;break}
    S.config.canais.push({id:uid(),nome:'Novo canal',taxa:0,cor:cor});touch('main');commit();
  },
  delCanal:function(d){if(S.config.canais.length<=1)return;S.config.canais=S.config.canais.filter(function(c){return c.id!==d.id});touch('main');commit()},
  delCat:function(d){S.config.categorias.splice(+d.i,1);touch('main');commit()},
  exportBackup:function(){saveFile('backup-e-sousa-'+todayStr()+'.json',JSON.stringify(S,null,1))},
  exportCsv:function(d){
    var rows;
    if(d.k==='vendas'){rows=[['Data','Canal','Item','Qtd','Preço unit.','Total','Taxa','Frete','Recebido','Custo unit.','Lucro']].concat(S.vendas.slice().sort(function(a,b){return a.data<b.data?-1:1}).map(function(v){return [v.data,canalInfo(v.canal).nome,v.nome,v.qtd,fmtIn(v.unit),fmtIn(bruto(v)),fmtIn(v.taxa),fmtIn(v.frete),v.recebido?'sim':'não',fmtIn(v.custoUn),fmtIn(lucroV(v))]}))}
    else if(d.k==='despesas'){rows=[['Data','Descrição','Categoria','Valor','Pago','Canal']].concat(S.despesas.slice().sort(function(a,b){return a.data<b.data?-1:1}).map(function(x){return [x.data,x.desc,x.cat,fmtIn(x.valor),x.pago?'sim':'não',x.canal?canalInfo(x.canal).nome:'']}))}
    else{rows=[['Produto','Código','Custo','Preço','Controla estoque','Estoque atual','Mínimo']].concat(S.produtos.map(function(p){var q=estoque(p);return [p.nome,p.sku,fmtIn(p.custo),fmtIn(p.preco),p.controla?'sim':'não',q===null?'':q,p.min||0]}))}
    saveFile(d.k+'-e-sousa.csv',toCsv(rows));
  },
  importJson:function(){$('#fileJson').value='';$('#fileJson').click()},
  importCsv:function(){$('#fileCsv').value='';$('#fileCsv').click()},
  importVendas:function(){$('#fileVendas').value='';$('#fileVendas').click()},
  clearEx:function(d,b){arm(b,function(){
    touchAll();
    S.produtos=S.produtos.filter(function(x){return !x.ex});S.vendas=S.vendas.filter(function(x){return !x.ex});S.despesas=S.despesas.filter(function(x){return !x.ex});
    S.movs=S.movs.filter(function(m){return !!prodById(m.prod)});
    commit();toast('Exemplos apagados. Pode começar com os seus dados.');
  })},
  wipe:function(d,b){arm(b,function(){touchAll();var c=S.config;S=normalize({config:c});commit();toast('Todos os dados foram apagados.')})}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b){if(e.target===$('#sheet'))closeSheet();return}
  var a=act[b.dataset.act];if(a)a(b.dataset,b);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SH){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('li[data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='sheetForm'){
    e.preventDefault();if(!SH)return;
    var r=SH.onSubmit(f.elements);
    if(r===true||r===undefined)closeSheet();else $('#sheetErr').textContent=r;
    return;
  }
  if(f.dataset&&f.dataset.form==='cat'){
    e.preventDefault();var v=$('#newCat').value.trim();
    if(v&&S.config.categorias.indexOf(v)<0){S.config.categorias.push(v);touch('main');commit()}
  }
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
  var c=S.config.canais.filter(function(x){return x.id===t.dataset.id})[0];if(!c)return;
  if(k==='canalNome'){c.nome=t.value.trim()||c.nome}
  if(k==='canalTaxa'){c.taxa=Math.max(0,Math.min(100,parseNum(t.value)));t.value=fmtIn(c.taxa).replace(',00','')}
  if(k==='canalFixa'){c.taxaFixa=Math.max(0,parseNum(t.value));t.value=fmtIn(c.taxaFixa)}
  touch('main');persist();
});
document.addEventListener('input',function(e){
  if(e.target.id==='busca'){V.busca=e.target.value;$('#estList').innerHTML=estList()}
});
$('#fileJson').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);if(!j||!Array.isArray(j.vendas)||!Array.isArray(j.produtos))throw 0;
      openSheet('Restaurar backup','<p class="help" style="margin:0">Este backup tem <b>'+j.produtos.length+'</b> produtos, <b>'+j.vendas.length+'</b> vendas e <b>'+(j.despesas||[]).length+'</b> despesas. Restaurar substitui tudo o que está no painel agora.</p>',{
        submit:'Restaurar e substituir',noFocus:true,
        onSubmit:function(){touchAll();S=normalize(j);touchAll();commit();toast('Backup restaurado.');return true}
      });
    }catch(x){toast('Esse arquivo não parece um backup do painel.')}
  };
  r.readAsText(f);
});
$('#fileCsv').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    var ps=csvProdutos(String(r.result));
    if(!ps.length){toast('Não encontrei produtos. A planilha precisa de uma coluna “nome”.');return}
    openSheet('Importar produtos','<p class="help" style="margin:0">Encontrei <b>'+ps.length+'</b> produtos na planilha. Eles são adicionados aos que você já tem.</p>',{
      submit:'Importar '+ps.length,noFocus:true,
      onSubmit:function(){ps.forEach(function(p){S.produtos.push(p)});touch('main');commit();toast(ps.length+' produtos importados.');return true}
    });
  };
  r.readAsText(f);
});
$('#fileVendas').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  readTable(f,function(rows){
    var m=mapVendas(rows);
    if(m.err){toast(m.err);return}
    importVendasSheet(m);
  });
});
/* dica ao passar o dedo ou o mouse nas barras */
var tip=$('#tip');
function placeTip(e){var w=tip.offsetWidth,h=tip.offsetHeight,x=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX+12)),y=e.clientY-h-12;if(y<8)y=e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
document.addEventListener('pointerover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute('data-tip');tip.hidden=false;placeTip(e)});
document.addEventListener('pointermove',function(e){if(!tip.hidden)placeTip(e)});
document.addEventListener('pointerdown',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t){tip.textContent=t.getAttribute('data-tip');tip.hidden=false;placeTip(e)}else tip.hidden=true});

/* ---------- início ---------- */
$('#cfgBtn').innerHTML=ic('config');
$('#tabs').innerHTML=[['resumo','Resumo'],['vendas','Vendas'],['estoque','Estoque'],['despesas','Despesas'],['hist','Histórico']].map(function(t){return '<button type="button" data-act="tab" data-tab="'+t[0]+'">'+ic(t[0])+'<span>'+t[1]+'</span></button>'}).join('');
render();
loadRemote();
})();
</script>
